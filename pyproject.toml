[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "commerge"
version = "1.0.0"
description = "Chain of Merges (CoM): layer-wise model merging that corrects merging covariate shift"
license = {text = "MIT"}
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch==2.11.0",
    "torchvision==0.26.0",
    "nvidia-cublas-cu12==12.8.4.1; platform_machine == 'x86_64'",
    "nvidia-cuda-cupti-cu12==12.8.90; platform_machine == 'x86_64'",
    "nvidia-cuda-nvrtc-cu12==12.8.93; platform_machine == 'x86_64'",
    "nvidia-cuda-runtime-cu12==12.8.90; platform_machine == 'x86_64'",
    "nvidia-cudnn-cu12==9.19.0.56; platform_machine == 'x86_64'",
    "nvidia-cufft-cu12==11.3.3.83; platform_machine == 'x86_64'",
    "nvidia-cufile-cu12==1.13.1.3; platform_machine == 'x86_64'",
    "nvidia-curand-cu12==10.3.9.90; platform_machine == 'x86_64'",
    "nvidia-cusolver-cu12==11.7.3.90; platform_machine == 'x86_64'",
    "nvidia-cusparse-cu12==12.5.8.93; platform_machine == 'x86_64'",
    "nvidia-cusparselt-cu12==0.7.1; platform_machine == 'x86_64'",
    "nvidia-nccl-cu12==2.28.9; platform_machine == 'x86_64'",
    "nvidia-nvjitlink-cu12==12.8.93; platform_machine == 'x86_64'",
    "nvidia-nvshmem-cu12==3.4.5; platform_machine == 'x86_64'",
    "nvidia-nvtx-cu12==12.8.90; platform_machine == 'x86_64'",
    "triton==3.6.0; platform_machine == 'x86_64'",
    "sympy==1.14.0",
    "transformers==4.44.2",
    "tokenizers==0.19.1",
    "peft==0.21.2",
    "datasets==3.6.0",
    "fsspec==2025.3.0",
    "huggingface_hub==0.36.2",
    "safetensors==0.8.0",
    "pyarrow==25.0.1",
    "numpy==1.26.4",
    "scipy==1.17.1",
    "pillow==12.3.0",
    "pyyaml==6.0.3",
    "tqdm==4.70.1",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pyflakes==3.2.0"]
figures = ["matplotlib==3.9.4"]
synthetic = ["diffusers==0.37.1", "accelerate==1.13.0"]

[tool.uv]
environments = ["sys_platform == 'linux'"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.setuptools.packages.find]
include = ["commerge*"]

[tool.setuptools.package-data]
commerge = ["data/assets/*.pt", "data/assets/*.csv.gz", "data/assets/manifests/*.json.gz"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
