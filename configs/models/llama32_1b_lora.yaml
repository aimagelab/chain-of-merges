model:
  family: llama
  base: meta-llama/Llama-3.2-1B
  finetune: lora
  dtype: float32
  checkpoints:
    - checkpoints/llama32_1b_lora/snli
    - checkpoints/llama32_1b_lora/mnli
    - checkpoints/llama32_1b_lora/sick
    - checkpoints/llama32_1b_lora/qnli
    - checkpoints/llama32_1b_lora/rte
    - checkpoints/llama32_1b_lora/scitail
  tasks: [snli, mnli, sick, qnli, rte, scitail]

data:
  root: data
  batch_size: 16
  calibration: {split: train, num_samples: 500, seed: 420}

eval:
  split: test
  reference_acc: {snli: 87.53053745928338, mnli: 81.20224146714213, sick: 89.97146351406441, qnli: 87.32265446224257, rte: 79.71014492753623, scitail: 94.35559736594544}
